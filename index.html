<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fritura Andromeda - Dashboard Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="Logo.png" alt="AndromedaApp Logo" class="floating-logo">
    <div class="dashboard-window">
        <aside class="sidebar">
            <h3>opciones</h3>
            <button class="btn-menu">Abrir Ventana</button>
            <button class="btn-menu">Abrir Terminal</button>
            <button class="btn-menu" onclick="limpiarVentas()" style="color: #ff4d4d;">Cerrar Caja</button>
            
            <div style="margin-top:auto; display:flex; gap:12px; align-items:center; color:#fff; font-size: 0.9em;">
                <div style="width:40px; height:40px; background:#444; border-radius:50%; border:1px solid #ff3ca6;"></div>
                <span>user_97</span>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-nav">
                <div class="btn-menu" style="width:45px; justify-content:center;">≡</div>
                <div class="search-bar">
                    <input type="text" placeholder="" list="sugerencias">
                    <datalist id="sugerencias"></datalist>
                    <span style="color:#666">🔍</span>
                </div>
                
                <div class="add-container">
                    <button class="btn-plus-neon">+</button>
                    
                    <div id="add_f" class="add-f-window">
                        <h3>Añadir Producto</h3>
                        <input type="text" id="nombreId" placeholder="Nombre del producto">
                        <input type="number" id="precioId" placeholder="Precio ($)">
                        <button class="btn-plus-neon" style="width:100%; border-radius:10px; font-size:1rem;" onclick="crearBoton()">Guardar</button>
                    </div>
                </div>
            </header>

            <section class="workspace">
                <div class="panel-datos" style="flex:2;">
                    <h4 style="margin-bottom:15px; opacity:0.5;">Ventas Hoy</h4>
                    <div id="cuadro-ventas" class="scroll-area"></div>
                </div>
                <div class="panel-datos" style="flex:1;">
                    <h4 style="margin-bottom:15px; opacity:0.5;">Menú</h4>
                    <div id="contenedor-botones" class="scroll-area"></div>
                </div>
            </section>

            <footer>
                <div style="font-size: 1.8rem;">TOTAL : <span id="total-display" style="color:#ff3ca6">$0.00</span></div>
                <button class="btn-plus-neon" style="width:auto; padding:0 25px; font-size:1rem; border-radius:30px;" onclick="exportarSQL()">+</button>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
